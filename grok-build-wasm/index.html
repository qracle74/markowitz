<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Markowitz — grok-build — Proxy Path Fix</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>body{margin:0;font-family:ui-monospace;background:#0e0e10;color:#e6e6e6;display:flex;height:100vh}#left{width:400px;border-right:1px solid #222;padding:12px;overflow:auto;display:flex;flex-direction:column}#center{flex:1;display:flex;flex-direction:column}#term{flex:1;padding:8px;background:#0a0a0b}#diff{height:35%;border-top:1px solid #222;padding:10px;overflow:auto;background:#111113;white-space:pre-wrap;font-size:12px}button,input,select,textarea{background:#1a1a1e;color:#e6e6e6;border:1px solid #2a2a2e;padding:10px;border-radius:8px;width:100%;margin:6px 0}button{cursor:pointer;font-weight:800}#btn-run{background:#76b900;color:#000}#btn-loop{background:#ff8c00;color:#000}#btn-test{background:#00d1ff;color:#000}.muted{color:#8a8a90;font-size:12px}#prompt{height:90px}</style>
</head><body>
<div id="left">
<h3>🧠 grok-build — Proxy Fix</h3>
<div class="muted">VQE ✅ | Proxy auto-detect</div>
<input id="apiKey" type="password" placeholder="nvapi-..." />
<select id="model"><option value="meta/llama-3.1-405b-instruct" selected>meta/llama-3.1-405b-instruct (NVIDIA 안정)</option><option value="deepseek-ai/deepseek-v3.2">deepseek-v3.2</option><option value="deepseek-ai/deepseek-r1">deepseek-r1</option><option value="deepseek-ai/deepseek-v4-flash">deepseek-v4-flash</option></select>
<textarea id="prompt">1부터 100까지 짝수 합 계산 Rust 코드. main.rs에 저장할 수 있게 JSON {"type":"Edit","path":"main.rs","diff":"코드"} 형식으로만 출력.</textarea>
<button id="btn-test">⚛️ 1. VQE Test (API 불필요)</button>
<button id="btn-run">▶ 2. DeepSeek → agent_step</button>
<button id="btn-loop">♻️ 3. Autonomous Loop</button>
<div id="filetree" class="muted" style="flex:1;margin-top:8px"></div>
<div class="muted">Proxy: <span id="proxy">detecting...</span><br>State: <span id="state">-</span></div>
</div><div id="center"><div id="term"></div><div id="diff">// Tool JSON</div></div>
<script type="module">
import { Terminal } from "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm"
import initWasm, * as wasm from "./grok_qcore.js"
const BASE = "https://nvidia-proxy.parkskwan.workers.dev";
const CANDIDATE_PATHS = ["/v1/chat/completions", "/chat/completions", "/", "/v1/completions"];
let WORKER_URL = localStorage.getItem("worker_url") || BASE + "/v1/chat/completions";
const term=new Terminal({convertEol:true,fontSize:13,theme:{background:"#0a0a0b"}});term.open(document.getElementById("term"));
const $=id=>document.getElementById(id);
await initWasm(); term.writeln(`[ok] ${wasm.version()} loaded — vqe_energy(theta)=cos(theta) verified`); let globalState=wasm.agent_init(); $("state").textContent=globalState; $("proxy").textContent=WORKER_URL;
$("apiKey").value=localStorage.getItem("nv_key")||"";
const opfsRoot=await navigator.storage.getDirectory();
async function opfsWrite(p,c){const a=p.split("/").filter(Boolean);const n=a.pop();let d=opfsRoot;for(const x of a)d=await d.getDirectoryHandle(x,{create:true});const h=await d.getFileHandle(n,{create:true});const w=await h.createWritable();await w.write(c);await w.close();}
async function opfsList(dh=opfsRoot,pre=""){const o=[];for await(const[k,v] of dh.entries()){if(v.kind==="file")o.push(pre+k);else o.push(...await opfsList(v,pre+k+"/"))}return o;}
async function refresh(){const f=await opfsList();$("filetree").innerHTML=f.map(x=>`<div>📄 ${x}</div>`).join("")||"(empty)";}

$("btn-test").onclick=()=>{ const tests=[0,0.5,1,1.5708]; tests.forEach(t=>{ const e=wasm.vqe_energy(t); term.writeln(`vqe_energy(${t})=${e} cos=${Math.cos(t)} match=${Math.abs(e-Math.cos(t))<1e-12}`); }); term.writeln(`[ok] VQE = cos(theta) confirmed — this is Ry(theta) ansatz`); };

async function callDeepSeek(prompt){
  const key=$("apiKey").value.trim(); if(!key.startsWith("nvapi-")) throw new Error("nvapi- 키 필요"); localStorage.setItem("nv_key",key);
  const payload={model:$("model").value,messages:[{role:"user",content:prompt}],temperature:0.2,max_tokens:4000};
  // 저장된 URL 먼저 시도, 실패하면 다른 경로 자동 탐색
  const urlsToTry = [WORKER_URL,...CANDIDATE_PATHS.map(p=>BASE+p)].filter((v,i,a)=>a.indexOf(v)===i);
  for(const url of urlsToTry){
    try{
      term.writeln(`[try] POST ${url}`); $("proxy").textContent=url;
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},body:JSON.stringify(payload)});
      const text=await res.text(); term.writeln(` status=${res.status} len=${text.length}`);
      if(res.status===404){ term.writeln(` → 404, next path...`); continue; }
      if(!res.ok){ term.writeln(` → error ${text.slice(0,400)}`); if(res.status>=500) continue; throw new Error(`${res.status}: ${text.slice(0,400)}`); }
      const j=JSON.parse(text); const content=j.choices?.[0]?.message?.content || j.choices?.[0]?.text;
      if(!content) throw new Error(`empty content ${text.slice(0,400)}`);
      WORKER_URL=url; localStorage.setItem("worker_url",url); $("proxy").textContent=url+" ✅"; term.writeln(`[ok] Proxy locked: ${url}`); return content;
    }catch(e){ term.writeln(` fail: ${e.message.slice(0,200)}`); }
  }
  throw new Error(`All proxy paths failed. Check Cloudflare Worker routes.`);
}

$("btn-run").onclick=async()=>{
  try{
    const llm=await callDeepSeek($("prompt").value); term.writeln(`[llm] ${llm.slice(0,800)}`);
    const toolStr=wasm.agent_step(globalState, llm); term.writeln(`[agent_step] ${toolStr.slice(0,800)}`); $("diff").textContent=toolStr;
    const m=toolStr.match(/\{[\s\S]*"diff"[\s\S]*\}/) || toolStr.match(/\{[\s\S]*\}/); const tool=JSON.parse(m[0]);
    await opfsWrite(tool.path||"main.rs", tool.diff||tool.code); await refresh(); term.writeln(`[wrote] ${tool.path} — 2550 expected`);
    let s=JSON.parse(globalState); s.steps++; globalState=JSON.stringify(s); $("state").textContent=globalState;
    const e=wasm.vqe_energy(0.5); term.writeln(`[vqe_energy(0.5)]=${e}`);
  }catch(e){ term.writeln(`[error] ${e.message}`); }
};

$("btn-loop").onclick=async()=>{
  term.writeln(`♻️ Loop`); globalState=wasm.agent_init();
  for(let i=0;i<3;i++){ try{ const out=await callDeepSeek($("prompt").value); const ts=wasm.agent_step(globalState, out); term.writeln(`iter${i+1} ${ts.slice(0,400)}`); const t=JSON.parse(ts.match(/\{[\s\S]*\}/)[0]); if(t.diff) await opfsWrite(t.path||`main.rs`, t.diff); let s=JSON.parse(globalState); s.steps++; globalState=JSON.stringify(s); }catch(e){ term.writeln(`iter${i+1} err ${e.message}`); break; } } await refresh();
};
await refresh();
</script></body></html>
