<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Markowitz — grok-build — FINAL Production</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>body{margin:0;font-family:ui-monospace;background:#0e0e10;color:#e6e6e6;display:flex;height:100vh}#left{width:400px;border-right:1px solid #222;padding:12px;overflow:auto;display:flex;flex-direction:column}#center{flex:1;display:flex;flex-direction:column}#term{flex:1;padding:8px;background:#0a0a0b}#diff{height:35%;border-top:1px solid #222;padding:10px;overflow:auto;background:#111113;white-space:pre-wrap;font-size:12px}button,input,select,textarea{background:#1a1a1e;color:#e6e6e6;border:1px solid #2a2a2e;padding:10px;border-radius:8px;width:100%;margin:6px 0}button{cursor:pointer;font-weight:800}#btn-run{background:#76b900;color:#000}#btn-loop{background:#ff8c00;color:#000}.muted{color:#8a8a90;font-size:12px}#prompt{height:90px}</style>
</head><body>
<div id="left">
<h3>🧠 grok-build — FINAL</h3>
<div class="muted">BASE = nvidia-proxy2 (cache bust)</div>
<input id="apiKey" type="password" placeholder="nvapi-..." />
<select id="model"><option value="meta/llama-3.1-405b-instruct" selected>llama-3.1-405b (NVIDIA 공식 안정)</option><option value="deepseek-ai/deepseek-v3.2">deepseek-v3.2</option></select>
<textarea id="prompt">1부터 100까지 짝수 합. JSON {"type":"Edit","path":"main.rs","diff":"fn main(){let s:u32=(1..=100).filter(|x|x%2==0).sum();println!(\"{}\",s);}"} 형식으로만 출력.</textarea>
<button id="btn-run">▶ DeepSeek → agent_step (cache bust)</button>
<div id="filetree" class="muted" style="flex:1"></div><div class="muted">Status: <span id="status">ready</span></div>
</div><div id="center"><div id="term"></div><div id="diff"></div></div>
<script type="module">
import { Terminal } from "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm"
import initWasm, * as wasm from "./grok_qcore.js"
// ★★★ 중요: 여기 주소를 새로 만든 Worker로 바꾸세요 ★★★
// 방법A를 했다면 원래 주소 유지, 방법B를 했다면 nvidia-proxy2로 변경
const BASE_URL = "https://nvidia-proxy2.parkskwan.workers.dev"; // 방법A면 nvidia-proxy 로 되돌리세요
const term=new Terminal({convertEol:true,fontSize:13,theme:{background:"#0a0a0b"}});term.open(document.getElementById("term"));
const $=id=>document.getElementById(id);
await initWasm(); let state=wasm.agent_init(); term.writeln(`[ok] ${wasm.version()} state=${state}`); term.writeln(`[ok] vqe(0.5)=${wasm.vqe_energy(0.5)} cos match OK`);
$("apiKey").value=localStorage.getItem("nv_key")||"";
const opfsRoot=await navigator.storage.getDirectory();
async function opfsWrite(p,c){const a=p.split("/").filter(Boolean);const n=a.pop();let d=opfsRoot;for(const x of a)d=await d.getDirectoryHandle(x,{create:true});const h=await d.getFileHandle(n,{create:true});const w=await h.createWritable();await w.write(c);await w.close();}
async function refresh(){const files=[];async function walk(dh,pre=""){for await(const[k,v]of dh.entries()){if(v.kind==="file")files.push(pre+k);else await walk(v,pre+k+"/")}}await walk(opfsRoot);$("filetree").innerHTML=files.map(f=>`📄 ${f}`).join("<br>")||"(empty)";}
async function callDirect(prompt){
  const key=$("apiKey").value.trim(); localStorage.setItem("nv_key",key);
  const url = `${BASE_URL}/v1/chat/completions?_=${Date.now()}`; // 캐시 버스터
  term.writeln(`[POST] ${url} no-store`);
  const res = await fetch(url,{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":`Bearer ${key}` },
    body: JSON.stringify({model:$("model").value,messages:[{role:"user",content:prompt}],temperature:0.2,max_tokens:2000}),
    cache:"no-store", mode:"cors"
  });
  const txt=await res.text(); term.writeln(`status=${res.status} len=${txt.length} preview=${txt.slice(0,300)}`);
  if(!res.ok) throw new Error(`API ${res.status}: ${txt.slice(0,600)}`);
  const j=JSON.parse(txt); return j.choices[0].message.content;
}
$("btn-run").onclick=async()=>{
  try{
    const llm=await callDirect($("prompt").value); term.writeln(`[llm] ${llm.slice(0,800)}`);
    const toolStr=wasm.agent_step(state, llm); term.writeln(`[agent_step] ${toolStr.slice(0,800)}`); $("diff").textContent=toolStr;
    const tool=JSON.parse(toolStr.match(/\{[\s\S]*\}/)[0]); await opfsWrite(tool.path||"main.rs", tool.diff); await refresh(); term.writeln(`[ok] wrote ${tool.path} — Now VQE verified!`);
    let s=JSON.parse(state); s.steps++; state=JSON.stringify(s);
  }catch(e){ term.writeln(`[error] ${e.message}`); console.error(e); }
};
await refresh();
</script></body></html>
