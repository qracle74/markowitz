<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Markowitz — deepseek-v4 via NVIDIA — V5 Agent Loop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>body{margin:0;font-family:ui-monospace,monospace;background:#0e0e10;color:#e6e6e6;display:flex;height:100vh}#left{width:400px;border-right:1px solid #222;padding:12px;overflow:auto}#center{flex:1;display:flex;flex-direction:column}#term{flex:1;padding:8px;background:#0a0a0b}#diff{height:35%;border-top:1px solid #222;padding:10px;overflow:auto;background:#111113;white-space:pre-wrap;font-size:12px}button,input,select{background:#1a1a1e;color:#e6e6e6;border:1px solid #2a2a2e;padding:10px;border-radius:8px;width:100%;margin:6px 0}button{cursor:pointer;background:#76b900;color:#000;font-weight:800}button:hover{filter:brightness(1.1)}#btn-init,#btn-models{background:#1a1a1e;color:#e6e6e6;font-weight:400}.muted{color:#8a8a90;font-size:12px}.ok{color:#76b900}.err{color:#ff5a5a}</style>
</head><body>
<div id="left">
<h3>✅ V5 — Agent Loop + Proxy Ready</h3>
<div class="muted">Proxy: https://nvidia-proxy.parkskwan.workers.dev<br>Status: <span id="proxy-status">checking...</span></div>
<label class="muted">NVIDIA API Key (nvapi-...)</label><input id="apiKey" type="password" placeholder="nvapi-..." />
<label class="muted">Model</label><select id="model">
<option value="deepseek-ai/deepseek-v4-pro" selected>deepseek-ai/deepseek-v4-pro</option>
<option value="deepseek-ai/deepseek-v4-flash">deepseek-ai/deepseek-v4-flash (fallback)</option>
<option value="deepseek-ai/deepseek-r1">deepseek-ai/deepseek-r1</option>
</select>
<button id="btn-run">▶ 1. agent_init → 2. DeepSeek → agent_step</button>
<button id="btn-models">🔍 모델 목록 조회</button>
<button id="btn-init">샘플 생성 (OPFS)</button>
<div id="filetree" class="muted" style="margin-top:12px"></div>
<div class="muted"><span id="wasm-size">-</span> | <span id="wasm-ver">-</span> | <span id="status" class="ok">ready</span></div>
</div><div id="center"><div id="term"></div><div id="diff">// ToolCall JSON</div></div>
<script type="module">
import { Terminal } from "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm"
import initWasm, * as wasm from "./grok_qcore.js"
const WORKER_URL = "https://nvidia-proxy.parkskwan.workers.dev";
const term=new Terminal({convertEol:true,fontSize:13,theme:{background:"#0a0a0b"}});term.open(document.getElementById("term"));const $=id=>document.getElementById(id)

await initWasm();
term.writeln(`[ok] ${wasm.version()} loaded`);
$("wasm-ver").textContent=wasm.version();
try{const r=await fetch("./grok_qcore_bg.wasm",{cache:"no-store"});$("wasm-size").textContent=`${((await r.arrayBuffer()).byteLength/1024).toFixed(1)}KB`}catch{}
$("apiKey").value=localStorage.getItem("nv_key")||""
const opfsRoot=await navigator.storage.getDirectory()

// Proxy health check
try{
  const h = await fetch(WORKER_URL,{method:"GET",cache:"no-store"});
  const t = await h.text();
  $("proxy-status").innerHTML = h.ok? `<span class="ok">${t.slice(0,60)}</span>` : `<span class="err">${h.status} ${t.slice(0,100)}</span>`;
}catch(e){ $("proxy-status").innerHTML=`<span class="err">${e.message}</span>` }

async function opfsWrite(p,c){const a=p.split("/").filter(Boolean);const n=a.pop();let d=opfsRoot;for(const x of a){d=await d.getDirectoryHandle(x,{create:true});}const h=await d.getFileHandle(n,{create:true});const w=await h.createWritable();await w.write(c);await w.close();term.writeln(`[wrote] ${p} — ${c.length} bytes`)}
async function opfsList(dh=opfsRoot,pre=""){const o=[];for await(const [nm,hd] of dh.entries()){if(hd.kind==="file")o.push(pre+nm);else o.push(...await opfsList(hd,pre+nm+"/"))}return o}
async function refresh(){const f=await opfsList();document.getElementById("filetree").innerHTML=f.map(x=>`<div>📄 ${x}</div>`).join("")||"(empty)"}

const MARKOWITZ_PROMPT = `3-asset Markowitz. returns=[0.1,0.12,0.15], cov=[[0.04,0.01,0.02],[0.01,0.09,0.03],[0.02,0.03,0.16]], target=0.12. Write Rust code that uses vqe_energy(theta)=cos(theta) as risk model to find optimal weights. Output ONLY JSON {"type":"Edit","path":"main.rs","diff":"full Rust code"}`;

async function callNvidia(model, key, userContent){
  const payload={
    model, messages:[
      {role:"system", content:"You are grok-qcore. Output ONE JSON ToolCall only. No markdown. Schema: {\"type\":\"Edit\",\"path\":\"string\",\"diff\":\"string\"}. diff must be full valid Rust file using vqe_energy via wasm_bindgen."},
      {role:"user", content: userContent}
    ],
    temperature:0.7, top_p:0.95, max_tokens:16384, stream:false
  };
  const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},body:JSON.stringify(payload)});
  const text=await res.text();
  if(!res.ok) throw new Error(`${res.status}: ${text.slice(0,1200)}`);
  return JSON.parse(text);
}

$("btn-models").onclick=async()=>{
  const key=$("apiKey").value.trim(); if(!key.startsWith("nvapi-")){term.writeln("nvapi- 키 필요");return}
  try{const r=await fetch("https://integrate.api.nvidia.com/v1/models",{headers:{"Authorization":`Bearer ${key}`}});const j=await r.json();term.writeln((j.data||[]).map(m=>m.id).filter(id=>id.includes("deepseek")).join("\n"));}catch(e){term.writeln(`[models error] ${e.message}`)}
}
$("btn-init").onclick=async()=>{await opfsWrite("main.rs",`fn main(){ println!("init"); }`);await refresh()}

$("btn-run").onclick=async()=>{
  const key=$("apiKey").value.trim(); let model=$("model").value;
  if(!key.startsWith("nvapi-")){term.writeln("nvapi- 키 입력");return}
  localStorage.setItem("nv_key",key);
  try{
    // 1. agent_init — 검증된 시그니처
    let state_json = wasm.agent_init();
    term.writeln(`[agent_init] ${state_json.slice(0,200)}`);
    $("status").textContent="calling LLM...";
    // 2. LLM call
    let data;
    try{ data = await callNvidia(model, key, MARKOWITZ_PROMPT); }
    catch(e){
      if(String(e.message).includes("404") && model.includes("v4-pro")){
        term.writeln(`[fallback] 404 → flash 재시도`); model="deepseek-ai/deepseek-v4-flash";
        data = await callNvidia(model, key, MARKOWITZ_PROMPT);
      } else throw e;
    }
    let llm_output = data.choices?.[0]?.message?.content||"";
    term.writeln(`[llm raw] ${llm_output.slice(0,800)}`);
    // 3. agent_step(state, llm_output) — 2 args 버전
    let tool_json_str = wasm.agent_step(state_json, llm_output);
    term.writeln(`[agent_step] ${tool_json_str.slice(0,1000)}`);
    const tool = JSON.parse(tool_json_str);
    document.getElementById("diff").textContent=JSON.stringify(tool,null,2);
    if(tool.type==="Edit"){ await opfsWrite(tool.path, tool.diff); await refresh(); term.writeln(`[ok] ${tool.path} updated`); $("status").textContent="done"; }
    else { term.writeln(`[warn] type!= Edit`); }
  }catch(e){ term.writeln(`[error] ${e.message}\n${e.stack?.slice(0,500)}`); $("status").textContent="error"; }
}
await refresh()
</script></body></html>
