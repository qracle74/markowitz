<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Markowitz — grok-build 100% — Correct API</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>body{margin:0;font-family:ui-monospace;background:#0e0e10;color:#e6e6e6;display:flex;height:100vh}#left{width:400px;border-right:1px solid #222;padding:12px;overflow:auto;display:flex;flex-direction:column}#center{flex:1;display:flex;flex-direction:column}#term{flex:1;padding:8px;background:#0a0a0b}#diff{height:35%;border-top:1px solid #222;padding:10px;overflow:auto;background:#111113;white-space:pre-wrap;font-size:12px}button,input,select,textarea{background:#1a1a1e;color:#e6e6e6;border:1px solid #2a2a2e;padding:10px;border-radius:8px;width:100%;margin:6px 0}button{cursor:pointer;font-weight:800}#btn-run{background:#76b900;color:#000}#btn-loop{background:#ff8c00;color:#000}.muted{color:#8a8a90;font-size:12px}.ok{color:#76b900}#prompt{height:90px}</style>
</head><body>
<div id="left">
<h3>🧠 grok-build — Correct API</h3>
<div class="muted">API: agent_step(state, llm_output)<br>vqe_energy(theta: number)</div>
<input id="apiKey" type="password" placeholder="nvapi-..." />
<select id="model"><option value="deepseek-ai/deepseek-v4-flash" selected>deepseek-v4-flash</option><option value="deepseek-ai/deepseek-r1">deepseek-r1</option></select>
<textarea id="prompt">1부터 100까지 짝수 합 계산하는 Rust 코드 작성. main에서 println!으로 출력.</textarea>
<button id="btn-run">▶ 1. Single Step (DeepSeek → agent_step)</button>
<button id="btn-loop">♻️ 2. Autonomous Loop 5회 (100% grok-build)</button>
<div id="filetree" class="muted" style="flex:1;margin-top:8px"></div>
<div class="muted">State: <span id="state">-</span><br>VQE: <span id="vqe">-</span></div>
</div><div id="center"><div id="term"></div><div id="diff">// ToolCall JSON</div></div>
<script type="module">
import { Terminal } from "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm"
import initWasm, * as wasm from "./grok_qcore.js"
const WORKER_URL="https://nvidia-proxy.parkskwan.workers.dev";
const term=new Terminal({convertEol:true,fontSize:13,theme:{background:"#0a0a0b"}});term.open(document.getElementById("term"));
const $=id=>document.getElementById(id);
await initWasm(); term.writeln(`[ok] ${wasm.version()} loaded — agent_step(state, llm_output), vqe_energy(theta)`);
$("apiKey").value=localStorage.getItem("nv_key")||"";
const opfsRoot=await navigator.storage.getDirectory();
async function opfsWrite(p,c){const a=p.split("/").filter(Boolean);const n=a.pop();let d=opfsRoot;for(const x of a)d=await d.getDirectoryHandle(x,{create:true});const h=await d.getFileHandle(n,{create:true});const w=await h.createWritable();await w.write(c);await w.close();}
async function opfsList(dh=opfsRoot,pre=""){const o=[];for await(const[k,v] of dh.entries()){if(v.kind==="file")o.push(pre+k);else o.push(...await opfsList(v,pre+k+"/"))}return o;}
async function refresh(){const f=await opfsList();$("filetree").innerHTML=f.map(x=>`<div>📄 ${x}</div>`).join("")||"(empty)";}

let globalState = wasm.agent_init();
term.writeln(`init state => ${globalState}`); $("state").textContent = globalState;

async function callDeepSeek(prompt){
  const key=$("apiKey").value.trim(); localStorage.setItem("nv_key",key);
  const body=JSON.stringify({model:$("model").value,messages:[{role:"system",content:"You are a Rust code generator. Output raw Rust code OR JSON {type:Edit,path,diff}. No markdown fences if JSON."},{role:"user",content:prompt}],temperature:0.7,max_tokens:8000,stream:false});
  const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},body}); const j=await r.json(); return j.choices[0].message.content;
}

$("btn-run").onclick=async()=>{
  try{
    term.writeln(`[1] DeepSeek generating...`);
    const llmOutput = await callDeepSeek($("prompt").value);
    term.writeln(`[llm] ${llmOutput.slice(0,600)}`);

    term.writeln(`[2] agent_step(state, llm_output) calling...`);
    // 이게 설계자가 의도한 정확한 사용법!
    const toolStr = wasm.agent_step(globalState, llmOutput);
    term.writeln(`[tool] ${toolStr.slice(0,800)}`);
    $("diff").textContent = toolStr;

    const tool = JSON.parse(toolStr);
    if(tool.path && tool.diff){
      await opfsWrite(tool.path, tool.diff); await refresh();
      term.writeln(`[wrote] ${tool.path} (${tool.diff.length} bytes) — Verification: 2550 expected`);
    }
    // 상태 업데이트 (agent_step이 새 상태를 반환하는 경우, 또는 기존 유지)
    try{ const parsed=JSON.parse(toolStr); if(parsed.next_state) globalState=JSON.stringify(parsed.next_state); else { let s=JSON.parse(globalState); s.steps=(s.steps||0)+1; s.history=[...(s.history||[]), tool.path]; globalState=JSON.stringify(s); } }catch{ let s=JSON.parse(globalState); s.steps++; globalState=JSON.stringify(s); }
    $("state").textContent=globalState;

    // vqe_energy는 theta가 필요! 0.5로 테스트
    const energy = wasm.vqe_energy(0.5); term.writeln(`[vqe_energy(0.5)] = ${energy} (expected cos(0.5)=${Math.cos(0.5)})`); $("vqe").textContent=energy;
  }catch(e){ term.writeln(`[error] ${e.message}\n${e.stack}`); }
};

$("btn-loop").onclick=async()=>{
  term.writeln(`♻️ Autonomous Loop Start — 100% grok-build`);
  globalState = wasm.agent_init();
  for(let i=0;i<5;i++){
    term.writeln(`\n--- Iteration ${i+1}/5 --- state=${globalState}`);
    const llmOut = await callDeepSeek($("prompt").value + ` (iteration ${i+1}, previous state: ${globalState})`);
    const toolStr = wasm.agent_step(globalState, llmOut);
    term.writeln(`tool => ${toolStr.slice(0,500)}`);
    try{
      const tool=JSON.parse(toolStr); if(tool.diff){ await opfsWrite(tool.path||`main_v${i}.rs`, tool.diff); await refresh(); }
      let s=JSON.parse(globalState); s.steps++; s.history=[...(s.history||[]), `iter${i+1}`]; globalState=JSON.stringify(s);
      const e = wasm.vqe_energy(0.5 + i*0.1); term.writeln(`vqe_energy(${(0.5+i*0.1).toFixed(1)})=${e}`);
      if(e < 0.2){ term.writeln(`🎉 Converged at iter ${i+1}!`); break; }
    }catch(e){ term.writeln(`parse error ${e.message}`); }
  }
  term.writeln(`\n✅ Loop finished! 100% server-less grok-build complete.`);
  $("state").textContent=globalState;
};
await refresh();
</script></body></html>
